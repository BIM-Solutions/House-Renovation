<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Our Renovation</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" hidden aria-label="Back">&#8592;</button>
    <h1 id="pageTitle">Rooms</h1>
    <button class="icon-btn" id="menuBtn" hidden aria-label="More">&#8942;</button>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="view" aria-live="polite"></main>

  <button id="fab" class="fab" aria-label="Add task">+</button>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="rooms" class="active"><span class="tab-icon">&#127968;</span>Rooms</button>
    <button data-tab="tasks"><span class="tab-icon">&#9745;</span>Tasks</button>
    <button data-tab="shopping"><span class="tab-icon">&#128722;</span>Shopping</button>
    <button data-tab="settings"><span class="tab-icon">&#9881;</span>Settings</button>
  </nav>

  <!-- Task editor -->
  <dialog id="taskDialog" class="sheet">
    <form id="taskForm" method="dialog" novalidate>
      <header class="sheet-head">
        <button type="button" class="link" data-action="cancel">Cancel</button>
        <h2 id="taskDialogTitle">New task</h2>
        <button type="submit" class="link strong">Save</button>
      </header>
      <div class="sheet-body">
        <label class="field">
          <span>What needs doing?</span>
          <input name="title" type="text" required autocomplete="off" placeholder="e.g. Strip wallpaper">
        </label>
        <div class="field-row">
          <label class="field">
            <span>Room</span>
            <select name="roomId" id="taskRoom"></select>
          </label>
          <label class="field">
            <span>Who</span>
            <select name="assignee" id="taskAssignee"></select>
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span>Status</span>
            <select name="status">
              <option value="todo">To do</option>
              <option value="doing">In progress</option>
              <option value="done">Done</option>
            </select>
          </label>
          <label class="field">
            <span>Priority</span>
            <select name="priority">
              <option value="low">Low</option>
              <option value="normal" selected>Normal</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span>Due by</span>
            <input name="due" type="date">
          </label>
          <label class="field">
            <span>Est. cost (&pound;)</span>
            <input name="cost" type="number" inputmode="decimal" min="0" step="1" placeholder="0">
          </label>
        </div>
        <label class="field">
          <span>Notes</span>
          <textarea name="notes" rows="3" placeholder="Measurements, colours, links, who to call..."></textarea>
        </label>

        <fieldset class="materials">
          <legend>Materials &amp; tools needed</legend>
          <div id="materialRows"></div>
          <button type="button" class="btn ghost small" data-action="add-material">+ Add item</button>
        </fieldset>

        <button type="button" class="btn danger full" data-action="delete" id="taskDeleteBtn" hidden>Delete task</button>
      </div>
    </form>
  </dialog>

  <!-- Room editor -->
  <dialog id="roomDialog" class="sheet small">
    <form id="roomForm" method="dialog" novalidate>
      <header class="sheet-head">
        <button type="button" class="link" data-action="cancel">Cancel</button>
        <h2 id="roomDialogTitle">New room</h2>
        <button type="submit" class="link strong">Save</button>
      </header>
      <div class="sheet-body">
        <label class="field">
          <span>Room name</span>
          <input name="name" type="text" required autocomplete="off" placeholder="e.g. Kitchen">
        </label>
        <button type="button" class="btn danger full" data-action="delete" id="roomDeleteBtn" hidden>Delete room and its tasks</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
